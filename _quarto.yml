project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!CLAUDE.md"
    - "!drafts/**"
  post-render:
    - touch docs/.nojekyll

website:
  title: "Data Visualization 2026"
  description: "Part of the BDS Toolbox course in the Behavioral Data Science Master's at the University of Amsterdam"
  site-url: https://ann1ejohansson.github.io/data-visualization-2026/

  navbar:
    background: dark
    left:
      - href: index.qmd
        text: Home
      - href: https://github.com/ann1ejohansson/data-visualization-2026
        text: GitHub Repository
      - href: slides/slides.qmd
        text: Slides
      - href: assignments/assignment-1.qmd
        text: Assignment 1
      - href: assignments/assignment-2.qmd
        text: Assignment 2
      - text: Worksheets
        menu:
          - href: worksheets/ggplot-recap.qmd
            text: "1: Data & ggplot"
          - href: worksheets/ggplotly-handout.qmd
            text: "2: ggplotly" 
          - href: worksheets/working-with-ai.qmd
            text: "3: Working with AI"
      - text: Resources
        menu:
          - href: documents/working-on-the-server.qmd
            text: "Working on the server"
          - href: documents/git-workflow.qmd
            text: "Working with Git"
          - href: https://socviz.co/
            text: "Data Visualization: A Practical Introduction (Healy)"
          - href: https://r4ds.hadley.nz/data-visualize.html
            text: "R for Data Science - Data visualization chapter"

format:
  html:
    theme: cosmo         # Bootstrap theme (others: flatly, minty, etc.)
    toc: true            # Table of contents on each page
    toc-depth: 2
    number-sections: false
    code-copy: true      # Adds copy button to code blocks
